name: Build Windows test package

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: >-
          dotnet publish TeletextRecoveReese/TeletextRecoveReese.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "$env:RUNNER_TEMP/publish"
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Store Windows build
        uses: actions/upload-artifact@v7
        with:
          name: TeletextRecoveReese-windows-test
          path: ${{ runner.temp }}/publish/*
          if-no-files-found: error
